<!doctype html>
<!--
  Relais de connexion OAuth pour l'Echo (à publier en HTTPS, par exemple sur GitHub Pages, puis à
  mettre dans le réglage OAUTH_RELAY de l'Echo).

  Les services en ligne (Notion, Linear…) n'acceptent comme adresse de retour que HTTPS ou 127.0.0.1.
  L'Echo est sur le réseau local en http://192.168.x.x : cette page reçoit le retour, lit l'adresse
  locale de l'Echo cachée dans « state » (après le point, en base64url) et y renvoie le navigateur.
  Rien n'est envoyé ailleurs : le code reste dans le navigateur. Seules les adresses locales
  (réseau privé, .local, localhost) sont acceptées, pour ne pas servir de redirection ouverte.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Echo · connexion</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f3f3f5; color: #111114;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      main { max-width: 420px; padding: 32px; border-radius: 28px; background: #fafafb; text-align: center;
        box-shadow: 0 0 0 1px rgb(17 17 20 / 0.04), 0 16px 32px -20px rgb(17 17 20 / 0.18); }
      @media (prefers-color-scheme: dark) { body { background: #141417; color: #f3f3f5 } main { background: #1b1b1f } }
    </style>
  </head>
  <body>
    <main><p id="msg">Retour vers l'Echo…</p></main>
    <script>
      ;(function () {
        var q = new URLSearchParams(location.search)
        var state = q.get("state") || ""
        var b64 = state.split(".")[1] || ""
        var origin = ""
        try {
          origin = atob(b64.replace(/-/g, "+").replace(/_/g, "/"))
        } catch (e) {}
        var ok = /^https?:\/\/(localhost|127\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|[a-z0-9-]+\.local)(:\d{1,5})?$/i.test(origin)
        if (!ok) {
          document.getElementById("msg").textContent = "Lien de connexion invalide. Recommence depuis la page de l'Echo."
          return
        }
        location.replace(origin + "/oauth/mcp" + location.search)
      })()
    </script>
  </body>
</html>
